<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Littlewood fractals (WebGPU)</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <svg id="keyPaths" aria-hidden="true"></svg>
    <div id="handles"></div>
    <form id="panel" onsubmit="return false">
      <label>Degree <input id="degree" type="number" min="1" max="32" value="20" /></label>
      <label>Coefficients <input id="coeffs" type="text" value="1, -1" spellcheck="false" /></label>
      <label>Colour
        <select id="color">
          <option value="1">hue by low-order coefficients</option>
          <option value="0">density (inferno)</option>
        </select>
      </label>
      <label>Kernel
        <select id="kernel">
          <option value="auto">auto (fastest on this GPU)</option>
          <option value="perPoly">thread per polynomial</option>
          <option value="coop">cooperative (thread per root)</option>
        </select>
      </label>
      <label>Enumeration
        <select id="enumeration" title="Reciprocal: solve one polynomial of each reversed pair and plot z and 1/z (same picture, about half the work). Plain: solve every polynomial.">
          <option value="reciprocal">reciprocal symmetry (≈2× faster)</option>
          <option value="plain">plain (every polynomial solved)</option>
        </select>
      </label>
      <!-- step="any": keyframed exposure/gamma are interpolated, and a stepped slider would round them -->
      <label>Exposure <input id="exposure" type="range" min="0.2" max="3" step="any" value="1" /></label>
      <label>Gamma <input id="gamma" type="range" min="0.2" max="1.5" step="any" value="0.6" /></label>
      <div class="row">
        <button id="zoomIn" type="button">Zoom +</button>
        <button id="zoomOut" type="button">Zoom −</button>
        <button id="reset" type="button">Reset view</button>
      </div>
      <div class="row export">
        <input id="exportW" type="number" min="1" value="3840" aria-label="export width" />
        <span>×</span>
        <input id="exportH" type="number" min="1" value="2160" aria-label="export height" />
        <button id="savePng" type="button">Save PNG</button>
      </div>
      <label class="check"><input id="rings" type="checkbox" /> Show coefficient rings (Save PNG and animations)</label>
      <output id="exportStatus"></output>
      <div class="row">
        <button id="load" type="button" title="Restore the settings stored in a PNG, MP4 or .json made by this app (or drop the file on the page)">Load…</button>
        <button id="saveSettings" type="button" title="Download the current settings (and keyframes) as JSON">Save settings (.json)</button>
        <input id="loadFile" type="file" accept=".png,.mp4,.json,image/png,video/mp4,application/json" hidden />
      </div>
      <output id="fileStatus"></output>
      <details id="anim">
        <summary>Animation <span id="keyCount"></span></summary>
        <div class="row">
          <button id="addKey" type="button" title="Store the current coefficients (and view, exposure/gamma if attached) as the next keyframe">Add keyframe</button>
          <button id="clearKeys" type="button">Clear</button>
        </div>
        <label class="check"><input id="attachView" type="checkbox" checked /> Attach view (zoom + centre)</label>
        <label class="check"><input id="attachDisplay" type="checkbox" checked /> Attach exposure/gamma</label>
        <ol id="keyList"></ol>
        <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="timeline" disabled />
        <div class="row">
          <button id="play" type="button" disabled>▶ Preview</button>
          <label class="check"><input id="loop" type="checkbox" /> Loop back to start</label>
        </div>
        <label>Frames <input id="frames" type="number" min="2" max="100000" value="120" /></label>
        <label>FPS <input id="fps" type="number" min="1" max="120" value="30" /></label>
        <label>Easing
          <select id="easing">
            <option value="smooth">smooth (ease in/out)</option>
            <option value="linear">linear</option>
          </select>
        </label>
        <label>Brightness
          <select id="brightness">
            <option value="locked">locked: density per area (zoom-aware)</option>
            <option value="frame0">locked to frame 0's densest pixel</option>
            <option value="perFrame">per frame (may pulse)</option>
          </select>
        </label>
        <label>Quality
          <select id="quality">
            <option value="1">100 % (final)</option>
            <option value="0.5">50 % draft</option>
            <option value="0.25">25 % draft</option>
            <option value="0.1">10 % draft</option>
          </select>
        </label>
        <label>Output
          <select id="output">
            <option value="mp4">MP4 (H.264)</option>
            <option value="mp4+png">MP4 + PNG frames</option>
            <option value="png">PNG frames</option>
          </select>
        </label>
        <div class="row">
          <button id="renderAnim" type="button" title="Size: the W × H above">Render</button>
          <button id="cancelAnim" type="button" disabled>Cancel</button>
        </div>
        <output id="animStatus"></output>
      </details>
      <output id="status"></output>
    </form>
    <div id="error" hidden></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
